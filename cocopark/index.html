<script>
// ============================================================
// CONFIG
// Supabase の接続情報。空のままだと「デモモード」（このブラウザ内だけで動作）になります。
// ============================================================
const SUPABASE_URL      = 'https://vbcxafnskkfdecgeynqz.supabase.co';   // 例: 'https://xxxxxxxx.supabase.co'
const SUPABASE_ANON_KEY = 'sb_publishable_cHzJYKYK_voCzA3DoW5Gqg_Ob2N06q7';   // Publishable key（anon key）
const DEMO = !(SUPABASE_URL && SUPABASE_ANON_KEY);

// ============================================================
// INITIAL DATA（デモモード用。Supabase では supabase/schema.sql の初期データを使用）
// ============================================================
const DEFAULT_EXHIBITORS = [
  { id:'ex01', name:'グリーンカフェ',       category:'フード・ドリンク',     emoji:'☕',  co2:0.3 },

  { id:'ex05', name:'フラワーショップ花',   category:'クラフト・雑貨',       emoji:'🌸',  co2:0.5 },
  { id:'ex06', name:'ウッドクラフト工房',   category:'クラフト・雑貨',       emoji:'🪵',  co2:0.8 },

  { id:'ex09', name:'アートギャラリー',     category:'クラフト・雑貨',       emoji:'🖼️', co2:0.3 },
  { id:'ex10', name:'キッズアトリエ',       category:'体験・アクティビティ', emoji:'🎨',  co2:0.7 },
  { id:'ex11', name:'ヨガスタジオ',         category:'体験・アクティビティ', emoji:'🧘',  co2:1.0 },
  { id:'ex12', name:'フォトスポット',       category:'体験・アクティビティ', emoji:'📸',  co2:0.2 },
  { id:'ex13', name:'スポーツ体験コーナー', category:'体験・アクティビティ', emoji:'⚽',  co2:0.8 },
  { id:'ex14', name:'アロマテラピー',       category:'ウェルネス',           emoji:'🌿',  co2:0.6 },
  { id:'ex15', name:'マッサージコーナー',   category:'ウェルネス',           emoji:'💆',  co2:0.5 },
  { id:'ex16', name:'ハーブガーデン',       category:'ウェルネス',           emoji:'🌱',  co2:1.2 },
  { id:'ex17', name:'ミュージックステージ', category:'エンタメ',             emoji:'🎵',  co2:0.4 },
  { id:'ex18', name:'ペット写真館',         category:'エンタメ',             emoji:'🐾',  co2:0.3 },
  { id:'ex19', name:'エコショップ',         category:'サステナブル',         emoji:'♻️', co2:2.0 },
  { id:'ex20', name:'ベジタブルマーケット', category:'フード・ドリンク',     emoji:'🥦',  co2:1.0 },
];

const DEFAULT_CANDIDATES = [
  { id:'ca01', name:'グリーンカフェ',       category:'フード・ドリンク', emoji:'☕' },
  { id:'ca02', name:'フラワーショップ花',   category:'クラフト・雑貨',   emoji:'🌸' },
  { id:'ca03', name:'キッズアトリエ',       category:'体験・アクティビティ', emoji:'🎨' },
  { id:'ca04', name:'アロマテラピー',       category:'ウェルネス',       emoji:'🌿' },
  { id:'ca05', name:'ミュージックステージ', category:'エンタメ',         emoji:'🎵' },
  { id:'ca06', name:'エコショップ',         category:'サステナブル',     emoji:'♻️' },
  { id:'ca07', name:'ウッドクラフト工房',   category:'クラフト・雑貨',   emoji:'🪵' },
  { id:'ca08', name:'ヨガスタジオ',         category:'体験・アクティビティ', emoji:'🧘' },
];

// ============================================================
// BACKEND: DEMO（localStorage 上でサーバーの動きを再現）
// ============================================================
const DemoDB = {
  KEY: 'demo_db',
  load() {
    let d = null;
    try { d = JSON.parse(localStorage.getItem(this.KEY) || 'null'); } catch {}
    if (!d) {
      d = {
        settings: { event_name:'公園フェス2026', voting_open:false, interim_revealed:false, results_revealed:false },
        pw: 'admin1234',
        exhibitors: DEFAULT_EXHIBITORS.map((e, i) => ({ ...e, sort:i })),
        candidates: DEFAULT_CANDIDATES.map((c, i) => ({ ...c, sort:i })),
        visitors: {}, scans: [], votes: [],
      };
      this.save(d);
    }
    return d;
  },
  save(d) { localStorage.setItem(this.KEY, JSON.stringify(d)); },
};

const DemoAPI = {
  async getPublic() {
    const d = DemoDB.load();
    return { settings:d.settings, exhibitors:d.exhibitors, candidates:d.candidates };
  },
  async register(nick) {
    const d = DemoDB.load();
    const id = 'd' + Math.random().toString(36).slice(2, 12);
    d.visitors[id] = { nickname:nick };
    DemoDB.save(d);
    return id;
  },
  async getMe(vid) {
    const d = DemoDB.load();
    if (!d.visitors[vid]) return { exists:false, scans:[], votes:{} };
    const votes = {};
    d.votes.filter(v => v.v === vid).forEach(v => { votes[v.c] = (votes[v.c] || 0) + v.p; });
    return { exists:true, scans:d.scans.filter(s => s.v === vid).map(s => s.e), votes };
  },
  async addScan(vid, eid) {
    const d = DemoDB.load();
    if (!d.visitors[vid]) throw new Error('unknown_visitor');
    if (!d.exhibitors.some(e => e.id === eid)) throw new Error('invalid_exhibitor');
    if (d.scans.some(s => s.v === vid && s.e === eid)) return false;
    d.scans.push({ v:vid, e:eid });
    DemoDB.save(d);
    return true;
  },
  async submitVotes(vid, votes) {
    const d = DemoDB.load();
    if (!d.settings.voting_open) throw new Error('voting_closed');
    if (!d.visitors[vid]) throw new Error('unknown_visitor');
    const entries = Object.entries(votes).filter(([, n]) => n > 0);
    const req   = entries.reduce((a, [, n]) => a + n, 0);
    const total = d.scans.filter(s => s.v === vid).length;
    const spent = d.votes.filter(v => v.v === vid).reduce((a, v) => a + v.p, 0);
    if (req <= 0) throw new Error('empty');
    if (req !== total - spent) throw new Error('points_mismatch');
    if (entries.some(([c]) => !d.candidates.some(x => x.id === c))) throw new Error('invalid_candidate');
    entries.forEach(([c, n]) => d.votes.push({ v:vid, c, p:n }));
    DemoDB.save(d);
    return true;
  },
  async getResults(pw) {
    const d = DemoDB.load();
    if (!(d.settings.interim_revealed || d.settings.results_revealed || pw === d.pw)) throw new Error('not_revealed');
    return {
      candidates: d.candidates.map(c => {
        const vs = d.votes.filter(v => v.c === c.id);
        return { id:c.id, name:c.name, category:c.category, emoji:c.emoji,
                 pts: vs.reduce((a, v) => a + v.p, 0), sup: new Set(vs.map(v => v.v)).size };
      }),
      voters:   new Set(d.votes.map(v => v.v)).size,
      visitors: Object.keys(d.visitors).length,
      scans:    d.scans.length,
      co2:      d.scans.reduce((a, s) => a + (d.exhibitors.find(e => e.id === s.e)?.co2 || 0), 0),
    };
  },
  async adminLogin(pw) { return pw === DemoDB.load().pw; },
  _admin(pw) {
    const d = DemoDB.load();
    if (pw !== d.pw) throw new Error('unauthorized');
    return d;
  },
  async adminUpdateSettings(pw, patch) {
    const d = this._admin(pw);
    for (const k of ['event_name','voting_open','interim_revealed','results_revealed']) if (k in patch) d.settings[k] = patch[k];
    if (patch.new_pw) d.pw = patch.new_pw;
    DemoDB.save(d);
  },
  async adminUpsertExhibitor(pw, ex) {
    const d = this._admin(pw);
    const i = d.exhibitors.findIndex(e => e.id === ex.id);
    if (i >= 0) d.exhibitors[i] = { ...d.exhibitors[i], ...ex };
    else d.exhibitors.push({ ...ex, sort:d.exhibitors.length });
    DemoDB.save(d);
  },
  async adminDeleteExhibitor(pw, id) {
    const d = this._admin(pw);
    d.exhibitors = d.exhibitors.filter(e => e.id !== id);
    d.scans      = d.scans.filter(s => s.e !== id);
    DemoDB.save(d);
  },
  async adminUpsertCandidate(pw, c) {
    const d = this._admin(pw);
    const i = d.candidates.findIndex(x => x.id === c.id);
    if (i >= 0) d.candidates[i] = { ...d.candidates[i], ...c };
    else d.candidates.push({ ...c, sort:d.candidates.length });
    DemoDB.save(d);
  },
  async adminDeleteCandidate(pw, id) {
    const d = this._admin(pw);
    d.candidates = d.candidates.filter(c => c.id !== id);
    d.votes      = d.votes.filter(v => v.c !== id);
    DemoDB.save(d);
  },
  async adminResetAll(pw) {
    const d = this._admin(pw);
    d.visitors = {}; d.scans = []; d.votes = [];
    DemoDB.save(d);
  },
};

// ============================================================
// BACKEND: SUPABASE
// ============================================================
const sb = DEMO ? null : window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY, { auth: { persistSession:false } });

async function rpc(fn, args) {
  const { data, error } = await sb.rpc(fn, args);
  if (error) throw new Error(error.message || 'error');
  return data;
}

const RemoteAPI = {
  async getPublic() {
    const [s, e, c] = await Promise.all([
      sb.from('settings').select('*').eq('id', 1).single(),
      sb.from('exhibitors').select('*').order('sort').order('id'),
      sb.from('candidates').select('*').order('sort').order('id'),
    ]);
    for (const r of [s, e, c]) if (r.error) throw new Error(r.error.message);
    return { settings:s.data, exhibitors:e.data.map(x => ({ ...x, co2:Number(x.co2) })), candidates:c.data };
  },
  register:             (nick)       => rpc('register_visitor', { p_nick:nick }),
  getMe:                (vid)        => rpc('get_me', { p_visitor:vid }),
  addScan:              (vid, eid)   => rpc('add_scan', { p_visitor:vid, p_exhibitor:eid }),
  submitVotes:          (vid, votes) => rpc('submit_votes', { p_visitor:vid, p_votes:votes }),
  getResults: async     (pw)         => { const r = await rpc('get_results', { p_pw:pw || null }); r.co2 = Number(r.co2); return r; },
  adminLogin:           (pw)         => rpc('admin_login', { p_pw:pw }),
  adminUpdateSettings:  (pw, patch)  => rpc('admin_update_settings', { p_pw:pw, p_patch:patch }),
  adminUpsertExhibitor: (pw, ex)     => rpc('admin_upsert_exhibitor', { p_pw:pw, p:ex }),
  adminDeleteExhibitor: (pw, id)     => rpc('admin_delete_exhibitor', { p_pw:pw, p_id:id }),
  adminUpsertCandidate: (pw, c)      => rpc('admin_upsert_candidate', { p_pw:pw, p:c }),
  adminDeleteCandidate: (pw, id)     => rpc('admin_delete_candidate', { p_pw:pw, p_id:id }),
  adminResetAll:        (pw)         => rpc('admin_reset_all', { p_pw:pw }),
};

const API = DEMO ? DemoAPI : RemoteAPI;

const ERR = {
  voting_closed:     '投票は現在受け付けていません',
  points_mismatch:   'ポイント数が一致しませんでした。最新の状態に更新します。',
  unauthorized:      'パスワードが違います',
  not_revealed:      'まだ公開されていません',
  invalid_exhibitor: 'このQRコードは無効です',
  unknown_visitor:   '来場者情報が見つかりません',
  empty:             'ポイントを配分してください',
  invalid_candidate: '投票対象が見つかりません。画面を更新してください。',
};
function errMsg(e) {
  const m = e?.message || '';
  return ERR[m] || ('通信エラーが発生しました（' + m + '）');
}

// ============================================================
// CLIENT STATE
// ============================================================
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, c => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c]));
const sum = (obj) => Object.values(obj).reduce((a, b) => a + b, 0);

// サーバーから取得したデータのキャッシュ
const C = { settings:{}, exhibitors:[], candidates:[], me:{ scans:[], votes:{} }, _pubAt:0 };

async function loadPublic(force) {
  if (!force && Date.now() - C._pubAt < 10000) return;
  Object.assign(C, await API.getPublic());
  C._pubAt = Date.now();
}

// この端末の来場者情報（IDとニックネーム、未確定の配分）
const V = {
  vid:      () => localStorage.getItem('vid')  || '',
  nick:     () => localStorage.getItem('nick') || '',
  set:      (vid, nick) => { localStorage.setItem('vid', vid); localStorage.setItem('nick', nick); },
  clear:    () => ['vid', 'nick', 'draft'].forEach(k => localStorage.removeItem(k)),
  draft:    () => { try { return JSON.parse(localStorage.getItem('draft') || '{}'); } catch { return {}; } },
  setDraft: (d) => localStorage.setItem('draft', JSON.stringify(d)),
};

// 存在する投票対象への正の配分だけを残す
function cleanDraft() {
  const ids = new Set(C.candidates.map(c => c.id));
  const out = {};
  for (const [k, v] of Object.entries(V.draft())) if (ids.has(k) && v > 0) out[k] = v;
  return out;
}

const P = {
  total: () => C.me.scans.length,             // 獲得ポイント
  spent: () => sum(C.me.votes),               // 確定済み投票数
  used:  () => sum(cleanDraft()),             // 配分中
  rem:   () => P.total() - P.spent() - P.used(),
};

async function ensureMe() {
  const vid = V.vid();
  const valid = DEMO || /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/i.test(vid);
  const me = valid ? await API.getMe(vid) : { exists:false };
  if (!me.exists) { V.clear(); go('/'); return false; }
  C.me = { scans:me.scans || [], votes:me.votes || {} };
  return true;
}

// CO2表示フォーマット (kg単位、小さい場合はg表示)
function fmtCO2(kg) {
  kg = Number(kg) || 0;
  if (kg === 0) return '0g';
  if (kg < 1) return Math.round(kg * 1000) + 'g';
  return kg.toFixed(1) + 'kg';
}

function fmtTime() {
  return new Date().toLocaleTimeString('ja-JP', { hour:'2-digit', minute:'2-digit', second:'2-digit' });
}

// ============================================================
// ROUTER
// ============================================================
let _seq = 0;
let _timers = [];
function stopTimers() { _timers.forEach(clearInterval); _timers = []; }
function every(ms, fn) { _timers.push(setInterval(fn, ms)); }

function go(path) {
  history.pushState({}, '', '#' + path);
  render();
}
window.addEventListener('popstate', render);
window.addEventListener('hashchange', render);

function currentPath() {
  return (location.hash || '#/').slice(1) || '/';
}

const PUBLIC_PATHS = ['/', '/results', '/interim'];

async function render() {
  const seq  = ++_seq;
  stopTimers();
  const path = currentPath();
  const app  = document.getElementById('app');
  const isAdmin = path.startsWith('/admin');

  // 来場者登録がまだなら、QRの行き先を覚えておいて登録画面へ
  if (!isAdmin && !PUBLIC_PATHS.includes(path) && !V.vid()) {
    if (path.startsWith('/scan/')) localStorage.setItem('pendingScan', path);
    go('/'); return;
  }

  updateNav(path);
  if (!app.innerHTML.trim()) app.innerHTML = pageLoading();

  try {
    const html = await buildPage(path);
    if (seq !== _seq || html === null) return;   // 別の画面に移動済み
    app.innerHTML = html;
    afterRender(path);
  } catch (e) {
    if (seq !== _seq) return;
    console.error(e);
    app.innerHTML = pageError(e);
  }
}

function updateNav(path) {
  const nav = document.getElementById('bottom-nav');
  const showNav = V.vid() && !path.startsWith('/admin') && path !== '/';
  nav.classList.toggle('hidden', !showNav);
  if (!showNav) return;
  document.querySelectorAll('.nav-btn').forEach(btn => {
    const active = path.startsWith(btn.dataset.path);
    btn.classList.toggle('text-green-600', active);
    btn.classList.toggle('font-bold', active);
    btn.classList.toggle('text-gray-400', !active);
  });
}

async function buildPage(path) {
  if (path === '/') {
    if (V.vid()) { go('/home'); return null; }
    await loadPublic();
    return pageWelcome();
  }
  if (path.startsWith('/admin')) return buildAdmin(path);

  if (path === '/results' || path === '/interim') {
    await loadPublic(true);
    const key = path === '/results' ? 'results_revealed' : 'interim_revealed';
    if (!C.settings[key]) return pageLocked(path === '/results' ? '結果はまだ公開されていません' : '中間発表はまだ公開されていません');
    const R = await API.getResults(null);
    return path === '/results' ? pageResults(R) : pageInterim(R);
  }

  await loadPublic(path === '/home' || path === '/vote' || path.startsWith('/scan/'));
  if (!(await ensureMe())) return null;

  if (path === '/home') return pageHome();
  if (path === '/scan') return pageScanList();
  if (path.startsWith('/scan/')) {
    const id = decodeURIComponent(path.split('/')[2] || '');
    const ex = C.exhibitors.find(e => e.id === id);
    if (!ex) return pageScanInvalid();
    const isNew = await API.addScan(V.vid(), id);
    if (isNew) C.me.scans.push(id);
    return pageScanResult(ex, isNew);
  }
  if (path === '/me')   return pageMe();
  if (path === '/vote') return pageVote();
  return `<div class="p-8 text-center text-gray-400">ページが見つかりません</div>`;
}

function afterRender(path) {
  if (path === '/home') {
    // 投票開始・結果公開を検知してボタンを出す
    every(20000, async () => {
      const before = JSON.stringify(C.settings);
      try { await loadPublic(true); } catch { return; }
      if (currentPath() === '/home' && JSON.stringify(C.settings) !== before) render();
    });
  }
  if (path === '/results' || path === '/interim') startLive(path);
  if (path === '/admin/qr') setTimeout(genQRCodes, 80);
}

// ============================================================
// COMMON PARTS
// ============================================================
function pageLoading() {
  return `<div class="min-h-screen flex flex-col items-center justify-center gap-3 text-gray-400 text-sm">
    <div class="spinner"></div><span>読み込み中...</span></div>`;
}

function pageError(e) {
  return `
  <div class="page min-h-screen flex flex-col items-center justify-center p-6 text-center">
    <div class="text-6xl mb-4">⚠️</div>
    <p class="text-gray-600 font-bold mb-2">${esc(errMsg(e))}</p>
    <p class="text-xs text-gray-400 mb-8">電波の良い場所で、もう一度お試しください。</p>
    <button onclick="render()" class="w-full bg-green-500 text-white font-bold py-3.5 rounded-xl tap-card">再読み込み</button>
  </div>`;
}

function pageLocked(msg) {
  return `

function groupBy(items) {
  const groups = {};
  items.forEach(x => { (groups[x.category] = groups[x.category] || []).push(x); });
  return groups;
}

    </div>

  </div>`;

async function startApp() {
  const input = document.getElementById('nickInput');
  const n = input.value.trim();
  if (!n) { input.classList.add('ring-2','ring-red-300'); return; }
  const btn = document.getElementById('startBtn');
  btn.disabled = true; btn.textContent = '登録中...';
  try {
    const vid = await API.register(n);
    V.set(vid, n);
    V.setDraft({});
    const pending = localStorage.getItem('pendingScan');
    localStorage.removeItem('pendingScan');
    go(pending || '/home');
  } catch (e) {
    alert(errMsg(e));
    btn.disabled = false; btn.textContent = 'はじめる 🎉';
  }
}

function pageVote() {
  const s   = C.settings;
  const sub = P.spent() > 0;
  if (P.total() - P.spent() - P.used() < 0) V.setDraft({});   // 配分が持ち点を超えていたら（全消去後など）やり直し

  // 確定済みで、新しいポイントがない
  if (sub && P.total() - P.spent() <= 0) return `
  <div class="page min-h-screen flex flex-col items-center justify-center p-6 text-center">
    <div class="text-7xl mb-4">✅</div>
    <h2 class="text-xl font-bold mb-2">投票完了！</h2>
    <p class="text-gray-400 text-sm mb-2">結果発表をお待ちください。</p>
    <p class="text-xs text-green-600 mb-8">新しいブースを訪問すると、追加でポイントが投票できます。</p>
    <button onclick="go('/scan')" class="w-full bg-green-500 text-white font-bold py-3 rounded-xl mb-3 tap-card">もっとブースを回る 📷</button>
    <button onclick="go('/home')" class="w-full bg-white border border-gray-200 text-gray-600 font-bold py-3 rounded-xl tap-card">ホームへ</button>
  </div>`;

  if (!s.voting_open) return `
  <div class="page min-h-screen flex flex-col items-center justify-center p-6 text-center">
    <div class="text-7xl mb-4">🔒</div>
    <h2 class="text-xl font-bold mb-2">投票は受け付けていません</h2>
    <p class="text-gray-400 text-sm">主催者が投票を開始するまでお待ちください</p>
  </div>`;

  if (P.total() === 0) return `
  <div class="page min-h-screen flex flex-col items-center justify-center p-6 text-center">
    <div class="text-7xl mb-4">📷</div>
    <h2 class="text-xl font-bold mb-2">まずブースを訪問しましょう</h2>

    <button onclick="go('/scan')" class="bg-green-500 text-white px-10 py-3 rounded-xl font-bold tap-card">スキャンへ</button>
  </div>`;

  const draft  = cleanDraft();
  const groups = groupBy(C.candidates);
  const rem    = P.rem();

  return `
  <div class="page p-4">
    <h2 class="text-lg font-bold mb-3">投票${sub ? ' <span class="text-sm font-normal text-green-500 ml-1">（追加）</span>' : ''}</h2>

    ${sub ? `<div class="bg-green-50 border border-green-200 rounded-xl p-3 mb-3 text-xs text-green-700">
      🔄 前回の投票に追加されます。新たに獲得した <strong>${P.total() - P.spent()} pt</strong> を配分してください。
    </div>` : ''}

    <!-- Remaining points indicator -->
    <div id="remCard" class="text-white rounded-2xl p-4 mb-3 flex items-center justify-between ${rem === 0 ? 'bg-blue-500' : 'bg-green-500'}">
      <div>
        <div class="text-xs text-white text-opacity-80">残り投票ポイント</div>
        <div class="text-4xl font-bold leading-none mt-1" id="remDisp">${rem}</div>
      </div>
      <div class="text-right">
        <div class="text-xs text-white text-opacity-80">合計ポイント</div>
        <div class="font-bold">${P.total()} pt</div>
      </div>
    </div>

    <div id="voteHint" class="text-xs mb-3 ${rem === 0 ? 'text-blue-500 font-bold' : 'text-gray-400'}">
      ${rem === 0 ? '✅ 全ポイント配分済み！確定できます。' : `すべてのポイントを配分してから確定できます。あと ${rem} pt 残っています。`}
    </div>

    <div class="space-y-4 mb-6">
      ${Object.entries(groups).map(([cat, items]) => `
        <div>
          <h3 class="text-xs font-bold text-gray-400 mb-2 px-1 uppercase tracking-wider">${esc(cat)}</h3>
          <div class="space-y-2">
            ${items.map(c => `
              <div class="bg-white rounded-xl p-3 shadow-sm flex items-center gap-3">
                <span class="text-2xl">${esc(c.emoji)}</span>
                <div class="flex-1 min-w-0">
                  <div class="text-sm font-medium truncate">${esc(c.name)}</div>
                </div>
                <div class="flex items-center gap-2 shrink-0">
                  <button onclick="chgVote('${c.id}',-1)"
                    class="w-8 h-8 bg-gray-100 rounded-full font-bold text-gray-500 flex items-center justify-center text-lg leading-none tap-card">−</button>
                  <span id="vc-${c.id}" class="w-7 text-center font-bold text-green-600">${draft[c.id] || 0}</span>
                  <button onclick="chgVote('${c.id}',1)"
                    class="w-8 h-8 bg-green-100 rounded-full font-bold text-green-600 flex items-center justify-center text-lg leading-none tap-card">＋</button>
                </div>
              </div>`).join('')}
          </div>
        </div>
      `).join('')}
    </div>

    <button id="submitBtn" onclick="confirmVote()"
      class="w-full font-bold py-4 rounded-xl text-lg transition-colors ${rem === 0 ? 'bg-blue-500 hover:bg-blue-600 text-white tap-card' : 'bg-gray-200 text-gray-400 cursor-not-allowed'}">
      ${rem === 0 ? '投票を確定する ✅' : `あと ${rem} pt 配分してください`}
    </button>
  </div>`;
}

function chgVote(id, delta) {
  const draft = cleanDraft();
  const cur   = draft[id] || 0;
  if (delta > 0 && P.rem() <= 0) {
    const el = document.getElementById('remDisp');
    if (el) { el.classList.add('text-red-200'); setTimeout(() => el.classList.remove('text-red-200'), 400); }
    return;
  }
  const newVal = Math.max(0, cur + delta);
  draft[id] = newVal;
  V.setDraft(draft);

  const rem  = P.rem();
  const done = rem === 0;

  const vcEl = document.getElementById('vc-' + id);
  if (vcEl) vcEl.textContent = newVal;

  const remEl = document.getElementById('remDisp');
  if (remEl) remEl.textContent = rem;

  const card = document.getElementById('remCard');
  if (card) card.className = card.className.replace(/bg-\w+-\d+/, done ? 'bg-blue-500' : 'bg-green-500');

  const hint = document.getElementById('voteHint');
  if (hint) {
    hint.className = `text-xs mb-3 ${done ? 'text-blue-500 font-bold' : 'text-gray-400'}`;
    hint.textContent = done
      ? '✅ 全ポイント配分済み！確定できます。'
      : `すべてのポイントを配分してから確定できます。あと ${rem} pt 残っています。`;
  }

  const btn = document.getElementById('submitBtn');
  if (btn) {
    if (done) {
      btn.className = 'w-full bg-blue-500 hover:bg-blue-600 text-white font-bold py-4 rounded-xl text-lg tap-card transition-colors';
      btn.textContent = '投票を確定する ✅';
    } else {
      btn.className = 'w-full bg-gray-200 text-gray-400 cursor-not-allowed font-bold py-4 rounded-xl text-lg transition-colors';
      btn.textContent = `あと ${rem} pt 配分してください`;
    }
  }
}

async function confirmVote() {
  if (P.rem() > 0) return;
  const draft = cleanDraft();
  const lines = C.candidates
    .filter(c => draft[c.id] > 0)
    .map(c => `  ${c.emoji} ${c.name}：${draft[c.id]}票`)
    .join('\n');
  if (!lines) return;
  if (!confirm(`以下の内容で投票を確定しますか？\n（確定後は変更できません）\n\n${lines}`)) return;

  const btn = document.getElementById('submitBtn');
  if (btn) { btn.disabled = true; btn.textContent = '送信中...'; }
  try {
    await API.submitVotes(V.vid(), draft);
    V.setDraft({});
  } catch (e) {
    alert(errMsg(e));
    if (e.message === 'points_mismatch') V.setDraft({});
  }
  C._pubAt = 0;
  render();
}

// 1秒ごとに時計、5秒ごとに集計を更新
function startLive(path) {
  every(1000, () => {
    const el = document.getElementById('live-time');
    if (el) el.textContent = fmtTime();
  });
  every(5000, async () => {
    try {
      await loadPublic(true);
      const key = path === '/results' ? 'results_revealed' : 'interim_revealed';
      if (currentPath() !== path) return;
      if (!C.settings[key]) { render(); return; }
      const R = await API.getResults(null);
      const root = document.getElementById('live-root');
      if (root && currentPath() === path) root.innerHTML = path === '/results' ? resultsInner(R) : interimInner(R);
    } catch (e) { console.warn(e); }
  });
}

        <div class="text-xs text-gray-400 mb-1">${esc(ex.category)}</div>
        ${ex.co2 ? `<div class="text-xs text-emerald-600 font-bold mb-2">🌱 CO₂削減 ${fmtCO2(ex.co2)}</div>` : ''}
        <div id="qr-${ex.id}" class="flex justify-center items-center min-h-[100px]">
          <div class="text-gray-200 text-xs">生成中...</div>
        </div>
        <div class="text-gray-200 text-xs mt-1">${esc(ex.id)}</div>
      </div>`).join('')}
    </div>
  </div>`;
}

function genQRCodes() {
  const baseUrl = qrBaseUrl();
  C.exhibitors.forEach(ex => {
    const el = document.getElementById('qr-' + ex.id);
    if (!el) return;
    el.innerHTML = '';
    new QRCode(el, {
      text:         baseUrl + '#/scan/' + ex.id,
      width:        110,
      height:       110,
      colorDark:    '#166534',
      colorLight:   '#ffffff',
      correctLevel: QRCode.CorrectLevel.M,
    });
  });
}

function pageAdminBooths() {

    </div>
    <p class="text-xs text-gray-400 mb-4">QRコードのスキャン対象となるブース一覧です。来場者はここに登録されたブースを訪問してポイントを獲得します。</p>

    <div class="bg-white rounded-2xl shadow-sm p-4 mb-4">

      ${booths.length === 0
        ? '<p class="text-center text-gray-300 text-sm py-4">まだ登録されていません</p>'
        : booths.map(b => `
        <div class="flex items-center gap-3 py-2 border-b border-gray-50 last:border-0">
          <span class="text-xl">${esc(b.emoji)}</span>
          <div class="flex-1 min-w-0">
            <div class="text-sm font-medium truncate">${esc(b.name)}</div>
            <div class="text-xs text-gray-400">${esc(b.category)}${b.co2 ? ` · 🌱 ${fmtCO2(b.co2)}` : ''}</div>
          </div>
          <button onclick="removeBooth('${b.id}')"
            class="text-xs text-red-400 px-2 py-1 border border-red-200 rounded-lg tap-card shrink-0">削除</button>
        </div>`).join('')}
    </div>

    <div class="bg-white rounded-2xl shadow-sm p-4 mb-4">
      <h3 class="font-bold text-gray-600 text-sm mb-3">新しいブースを追加</h3>
      <div class="mb-2">
        <label class="text-xs text-gray-400">ブース名</label>
        <input id="bName" type="text" placeholder="例：グリーンカフェ"
          class="w-full border border-gray-200 rounded-lg px-3 py-2 text-sm mt-1 focus:outline-none focus:ring-2 focus:ring-green-200">
      </div>
      <div class="mb-2">
        <label class="text-xs text-gray-400">カテゴリ</label>
        <input id="bCat" type="text" placeholder="例：フード・ドリンク"
          class="w-full border border-gray-200 rounded-lg px-3 py-2 text-sm mt-1 focus:outline-none focus:ring-2 focus:ring-green-200">
      </div>
      <div class="mb-2">
        <label class="text-xs text-gray-400">CO₂削減量（kg）</label>
        <input id="bCO2" type="number" step="0.1" min="0" placeholder="例：0.5"
          class="w-full border border-gray-200 rounded-lg px-3 py-2 text-sm mt-1 focus:outline-none focus:ring-2 focus:ring-green-200">
      </div>
      <div class="mb-3">
        <label class="text-xs text-gray-400">絵文字</label>
        <div class="flex flex-wrap gap-2 mt-1">
          ${EMOJIS.map(e => `<button onclick="selectEmoji('bEmoji','booth-emoji-btn','${e}')" class="booth-emoji-btn text-xl w-9 h-9 rounded-lg border border-gray-100 hover:bg-green-50 tap-card">${e}</button>`).join('')}
        </div>
        <input id="bEmoji" type="text" value="🏪" placeholder="絵文字"
          class="w-full border border-gray-200 rounded-lg px-3 py-2 text-sm mt-2 focus:outline-none focus:ring-2 focus:ring-green-200">
      </div>
      <button onclick="addBooth()" class="w-full bg-green-500 text-white font-bold py-2.5 rounded-xl tap-card">
        ＋ 追加する
      </button>
    </div>

    <button onclick="go('/admin/qr')" class="w-full bg-green-100 text-green-700 font-bold py-3 rounded-xl tap-card mb-2">
      📷 QRコードを生成・印刷
    </button>
  </div>`;
}

function selectEmoji(inputId, btnClass, e) {
  document.getElementById(inputId).value = e;
  document.querySelectorAll('.' + btnClass).forEach(btn => {
    btn.classList.toggle('bg-gray-100', btn.textContent === e);
    btn.classList.toggle('border-gray-400', btn.textContent === e);
  });
}

function addBooth() {
  const name  = document.getElementById('bName').value.trim();
  const cat   = document.getElementById('bCat').value.trim();
  const emoji = document.getElementById('bEmoji').value.trim() || '🏪';
  const co2   = parseFloat(document.getElementById('bCO2').value) || 0;
  if (!name) { document.getElementById('bName').classList.add('ring-2','ring-red-300'); return; }
  adminDo(pw => API.adminUpsertExhibitor(pw, { id:'ex' + Date.now(), name, category:cat || 'その他', emoji, co2 }));
}

function removeBooth(id) {
  if (!confirm('このブースを削除しますか？\n（このブースのQRコードはスキャンできなくなり、来場者がこのブースで得たポイントも消えます）')) return;
  adminDo(pw => API.adminDeleteExhibitor(pw, id));
}
